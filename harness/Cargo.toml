[package]
name = "lb-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LIKE-benchmark harness: formats, oracle, gate, timing, orchestration"

[[bin]]
name = "bench"
path = "src/main.rs"

[lib]
name = "lb_harness"
path = "src/lib.rs"

[features]
default = [
    "cand-uncompressed",
    "cand-uncompressed-memmem",
    "cand-simd-cut-fsst",
    "cand-dict-simd-cut-onpair",
    "cand-gate-canary",
    "cand-cpp-identity",
    "cand-simd-cut-onpair",
    "cand-simd-cut-onpair-debug",
    "cand-simd-cut-fsst-debug",
    "cand-lz4",
    "cand-fsst",
    "cand-fsst-like-tum",
    "scan-memmem",
    "scan-prefilter",
    "scan-cpp-std-find",
    "scan-classics",
    "scan-stringzilla",
]
cand-uncompressed = ["dep:lb-cand-uncompressed"]
cand-uncompressed-memmem = ["dep:lb-cand-uncompressed-memmem"]
cand-simd-cut-fsst = ["dep:lb-cand-simd-cut-fsst"]
cand-dict-simd-cut-onpair = ["dep:lb-cand-dict-simd-cut-onpair"]
cand-gate-canary = ["dep:lb-cand-gate-canary"]
cand-cpp-identity = ["dep:lb-cand-cpp-identity"]
cand-simd-cut-onpair = ["dep:lb-cand-simd-cut-onpair"]
cand-simd-cut-onpair-debug = ["dep:lb-cand-simd-cut-onpair-debug"]
cand-simd-cut-fsst-debug = ["dep:lb-cand-simd-cut-fsst-debug"]
cand-lz4 = ["dep:lb-cand-lz4"]
cand-fsst = ["dep:lb-cand-fsst"]
cand-fsst-like-tum = ["dep:lb-cand-fsst-like-tum"]
scan-memmem = ["dep:lb-scan-memmem"]
scan-prefilter = ["dep:lb-scan-prefilter"]
scan-cpp-std-find = ["dep:lb-scan-cpp-std-find"]
scan-classics = ["dep:lb-scan-classics"]
scan-stringzilla = ["dep:lb-scan-stringzilla"]

[dependencies]
lb-abi = { workspace = true }
lb-cand-uncompressed = { path = "../candidates/uncompressed", optional = true }
lb-cand-uncompressed-memmem = { path = "../candidates/uncompressed_memmem", optional = true }
lb-cand-simd-cut-fsst = { path = "../candidates/simd_cut_fsst", optional = true }
lb-cand-dict-simd-cut-onpair = { path = "../candidates/dict_simd_cut_onpair", optional = true }
lb-cand-gate-canary = { path = "../candidates/gate_canary", optional = true }
lb-cand-cpp-identity = { path = "../candidates/cpp_identity", optional = true }
lb-cand-simd-cut-onpair = { path = "../candidates/simd_cut_onpair", optional = true }
lb-cand-simd-cut-onpair-debug = { path = "../candidates/simd_cut_onpair_debug", optional = true }
lb-cand-simd-cut-fsst-debug = { path = "../candidates/simd_cut_fsst_debug", optional = true }
lb-cand-lz4 = { path = "../candidates/lz4", optional = true }
lb-cand-fsst = { path = "../candidates/fsst", optional = true }
lb-cand-fsst-like-tum = { path = "../candidates/fsst_like_tum", optional = true }
lb-scan-memmem = { path = "../scanners/memmem", optional = true }
lb-scan-prefilter = { path = "../scanners/prefilter", optional = true }
lb-scan-cpp-std-find = { path = "../scanners/cpp_std_find", optional = true }
lb-scan-classics = { path = "../scanners/classics", optional = true }
lb-scan-stringzilla = { path = "../scanners/stringzilla", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
xxhash-rust = { workspace = true }
arrow = "59.0.0"
parquet = "59.0.0"
csv = "1.4.0"
toml = "1.1.2"
base64 = "0.22.1"
humantime = "2.4.0"
core_affinity = "0.8.3"
clap = { version = "4.6.1", features = ["derive"] }
libsais-rs = "=0.2.2"

[dev-dependencies]
tempfile = "3"
