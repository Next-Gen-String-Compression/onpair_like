# The FSST-LIKE-Matching (DaMoN'26) benchmark workload — the paper's TPC-H
# LIKE patterns (benchmark/patterns.json, vendored + curated by
# datasets/fsst-like-tum/make_suites.py) over all four columns it queries.
# Zero-underscore patterns only; see suites/tpch-*-fsst-like-tum/.
# Same candidate/scanner/measure roster as specs/sqlstorm.toml.
# Prereqs:
#   python3 datasets/prepare.py --dataset tpch-ptype-sf10 \
#       --dataset tpch-ocomment-sf10 --dataset tpch-scomment-sf10
#   python3 datasets/fsst-like-tum/make_suites.py
#   bench bless --suite suites/<ds>-fsst-like-tum --dataset datasets/<ds>  (x4)
# Then:
#   cargo run --release --bin bench -- run specs/fsst-like-tum.toml -o results/fsst-like-tum

[[datasets]]
path = "../datasets/tpch-pname-sf10"

[[datasets]]
path = "../datasets/tpch-ptype-sf10"

[[datasets]]
path = "../datasets/tpch-ocomment-sf10"

[[datasets]]
path = "../datasets/tpch-scomment-sf10"

[[suites]]
path = "../suites/tpch-pname-sf10-fsst-like-tum"

[[suites]]
path = "../suites/tpch-ptype-sf10-fsst-like-tum"

[[suites]]
path = "../suites/tpch-ocomment-sf10-fsst-like-tum"

[[suites]]
path = "../suites/tpch-scomment-sf10-fsst-like-tum"

# Self-contained Matcher-based pipelines (candidates/common/matcher): each owns
# its scanner, so the [[scanners]] list below applies only to the decode/direct
# candidates further down. The dict_* pair evaluates the predicate once per
# UNIQUE value (the encoded domain) instead of once per row.
[[candidates]]
name = "uncompressed_memmem"

[[candidates]]
name = "uncompressed_prefilter"

[[candidates]]
name = "dict_uncompressed_prefilter"

[[candidates]]
name = "dict_fsst_like_tum"

[[candidates]]
name = "fsst_decode_prefilter"

[[candidates]]
name = "dict_fsst_decode_prefilter"

[[candidates]]
name = "fsst_prefilter"

[[candidates]]
name = "dict_fsst_prefilter"

[[candidates]]
name = "onpair"

[[candidates]]
name = "fsst"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst_like_utn"

[[candidates]]
name = "lz4"

[[candidates]]
name = "zstd"

[[candidates]]
name = "onpair_spiral"

[[candidates]]
name = "dict_onpair"

[[candidates]]
name = "dict_onpair_spiral"

[[scanners]]
name = "memmem"

[[scanners]]
name = "prefilter"

[measure]
chunk_rows = [0, 122880]  # 0 = whole column; 122880 = 60*2048 rows/chunk
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
