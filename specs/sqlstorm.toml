# Curated SQLStorm-crawl predicates (like_predicates.csv) over the three
# columns those predicates actually address: IMDB keyword/aka_name + TPC-H
# p_name. Workload realism, not a selectivity sweep — see
# datasets/SQLStorm/make_like_suites.py and suites/*-sqlstorm/.
# Same candidate/scanner/measure roster as specs/paper/clickbench-url-1m-contains.toml.
# Prereqs:
#   python3 datasets/prepare.py --dataset imdb-keyword --dataset imdb-akaname
#   python3 datasets/SQLStorm/make_like_suites.py
#   bench bless --suite suites/<id>-sqlstorm --dataset datasets/<id>  (x3)
# Then:
#   cargo run --release --bin bench -- run specs/sqlstorm.toml -o results/sqlstorm

[[datasets]]
path = "../datasets/imdb-keyword"

[[datasets]]
path = "../datasets/imdb-akaname"

[[datasets]]
path = "../datasets/tpch-pname-sf10"

[[suites]]
path = "../suites/imdb-keyword-sqlstorm"

[[suites]]
path = "../suites/imdb-akaname-sqlstorm"

[[suites]]
path = "../suites/tpch-pname-sf10-sqlstorm"

# Self-contained Matcher-based pipelines (candidates/common/matcher): each owns
# its scanner, so the [[scanners]] list below applies only to the decode/direct
# candidates further down. The dict_* pair evaluates the predicate once per
# UNIQUE value (the encoded domain) instead of once per row.
[[candidates]]
name = "uncompressed_memmem"

[[candidates]]
name = "uncompressed_prefilter"

[[candidates]]
name = "dict_uncompressed_prefilter"

[[candidates]]
name = "dict_fsst_like_tum"

[[candidates]]
name = "fsst_decode_prefilter"

[[candidates]]
name = "dict_fsst_decode_prefilter"

[[candidates]]
name = "fsst_prefilter"

[[candidates]]
name = "dict_fsst_prefilter"

[[candidates]]
name = "onpair"

[[candidates]]
name = "fsst"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst_like_utn"

[[candidates]]
name = "lz4"

[[candidates]]
name = "zstd"

[[candidates]]
name = "onpair_spiral"

[[candidates]]
name = "dict_onpair"

[[candidates]]
name = "dict_onpair_spiral"

[[scanners]]
name = "memmem"

[[scanners]]
name = "prefilter"

[measure]
chunk_rows = [0, 122880]  # 0 = whole column; 122880 = 60*2048 rows/chunk
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
