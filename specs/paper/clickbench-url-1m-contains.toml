# Same sweep as clickbench-url-1m.toml, but restricted to the 142 `contains`
# queries via the filtered suite clickbench-url-1m-contains-s42.
# The filtered suite is a copy of clickbench-url-1m-gen1-s42 with queries.jsonl
# reduced to op == "contains" (truth is embedded per-query; binding is via the
# dataset checksum only, so the reduction preserves validity).
#
#   cargo run --release --bin bench -- run specs/paper/clickbench-url-1m-contains.toml \
#       -o results/paper/clickbench-url-1m-contains

[[datasets]]
path = "../../datasets/clickbench-url-1m"

[[suites]]
path = "../../suites/clickbench-url-1m-contains-s42"

# Self-contained Matcher-based pipelines (candidates/common/matcher): each owns
# its scanner, so the [[scanners]] list below applies only to the decode/direct
# candidates further down. The dict_* pair evaluates the predicate once per
# UNIQUE value (the encoded domain) instead of once per row.
[[candidates]]
name = "uncompressed_memmem"

[[candidates]]
name = "uncompressed_prefilter"

[[candidates]]
name = "dict_uncompressed_prefilter"

[[candidates]]
name = "dict_fsst_like_tum"

[[candidates]]
name = "fsst_decode_prefilter"

[[candidates]]
name = "dict_fsst_decode_prefilter"

[[candidates]]
name = "fsst_prefilter"

[[candidates]]
name = "dict_fsst_prefilter"

# SGTT LLM-token-table pipelines: static-dictionary tokenizer codec
# (llm_token_tum, decode-then-eval) and its compressed-domain mandatory-chain
# prefilter (llm_token_prefilter, plus the encoded-domain dict_ peer).
[[candidates]]
name = "llm_token_tum"

[[candidates]]
name = "llm_token_prefilter"

[[candidates]]
name = "dict_llm_token_prefilter"

[[candidates]]
name = "onpair"

[[candidates]]
name = "fsst"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst_like_utn"

[[candidates]]
name = "lz4"

[[candidates]]
name = "zstd"

[[candidates]]
name = "onpair_spiral"

[[candidates]]
name = "dict_onpair"

[[candidates]]
name = "dict_onpair_spiral"

[[scanners]]
name = "memmem"

[[scanners]]
name = "prefilter"

[measure]
chunk_rows = [0, 122880]  # 0 = whole column; 122880 = 60*2048 rows/chunk
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
