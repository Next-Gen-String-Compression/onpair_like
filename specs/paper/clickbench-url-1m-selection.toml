# The contains sweep of clickbench-url-1m-contains.toml under selection
# vectors: an upstream predicate has already admitted a fraction of the rows,
# uniformly or in runs, and every strategy answers only for those. One chunk
# size, 512 Ki rows, so a 1M-row column is two row groups. Each selection
# multiplies the cells of the plain contains run, nine selections here.
#
#   cargo run --release --bin bench -- run specs/paper/clickbench-url-1m-selection.toml \
#       -o results/paper/clickbench-url-1m-selection
#
# A strategy without LB_STRATEGY_TAKES_SELECTION runs over every row and the
# harness ANDs its bitmap with the selection inside the timed sample; that is
# the no-pushdown baseline every pushdown strategy is read against.
#
# Root keys stay ABOVE the first [[table]] header (see spec.rs).
strategies = [
  "memmem",
  "prefilter",
  "dict+prefilter",
  "interp",
  "llvm-simd",
  "dict+interp",
  "decode",
  "decode+prefilter",
  "dict+decode+prefilter",
  "fsst-prefilter",
  "dict+fsst-prefilter",
  "llm-token-prefilter",
  "dict+llm-token-prefilter",
  "compressed",
  "dict+compressed",
  "comet",
  "pf_walk",
  "dict+pf_walk",
]

[[selections]]
kind = "all"

[[selections]]
kind = "uniform"
fraction = 0.001
seed = 7

[[selections]]
kind = "uniform"
fraction = 0.01
seed = 7

[[selections]]
kind = "uniform"
fraction = 0.1
seed = 7

[[selections]]
kind = "uniform"
fraction = 0.5
seed = 7

# Runs of 32 to 512 rows, mean 272. At fraction 0.001 that is one run per
# 272k rows, about four in the column; the shape is coarse there by design.
[[selections]]
kind = "runs"
run_rows_min = 32
run_rows_max = 512
fraction = 0.001
seed = 7

[[selections]]
kind = "runs"
run_rows_min = 32
run_rows_max = 512
fraction = 0.01
seed = 7

[[selections]]
kind = "runs"
run_rows_min = 32
run_rows_max = 512
fraction = 0.1
seed = 7

[[selections]]
kind = "runs"
run_rows_min = 32
run_rows_max = 512
fraction = 0.5
seed = 7

[[datasets]]
