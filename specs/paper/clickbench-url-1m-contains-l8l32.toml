# Fast subset of clickbench-url-1m-contains.toml: only the L8 + L32 contains
# queries (47 of 142) via the clickbench-url-1m-contains-l8l32-s42 suite, so a
# full-matrix run finishes ~3x sooner. Same candidates/scanners/measure config.
#
#   cargo run --release --bin bench -- run specs/paper/clickbench-url-1m-contains-l8l32.toml \
#       -o results/paper/clickbench-url-1m-contains-l8l32

[[datasets]]
path = "../../datasets/clickbench-url-1m"

[[suites]]
path = "../../suites/clickbench-url-1m-contains-l8l32-s42"

# Self-contained Matcher-based pipelines (candidates/common/matcher): each owns
# its scanner, so the [[scanners]] list below applies only to the decode/direct
# candidates further down. The dict_* pair evaluates the predicate once per
# UNIQUE value (the encoded domain) instead of once per row.
[[candidates]]
name = "uncompressed_memmem"

[[candidates]]
name = "uncompressed_prefilter"

[[candidates]]
name = "dict_uncompressed_prefilter"

[[candidates]]
name = "dict_fsst_like_tum"

[[candidates]]
name = "fsst_decode_prefilter"

[[candidates]]
name = "dict_fsst_decode_prefilter"

[[candidates]]
name = "fsst_prefilter"

[[candidates]]
name = "dict_fsst_prefilter"

[[candidates]]
name = "onpair"

[[candidates]]
name = "fsst"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst_like_utn"

[[candidates]]
name = "lz4"

[[candidates]]
name = "zstd"

[[candidates]]
name = "onpair_spiral"

[[candidates]]
name = "dict_onpair"

[[candidates]]
name = "dict_onpair_spiral"

[[scanners]]
name = "memmem"

[[scanners]]
name = "prefilter"

[measure]
chunk_rows = [0, 122880]  # 0 = whole column; 122880 = 60*2048 rows/chunk
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
