# `fsst_rs` dropped while it is unported to the local onpair's API;
# `onpair_spiral_pinned` added in its place.
#
# The contains sweep widened to five columns: every generated `contains` query
# of each, 498 in all, against the same candidates the single-column run uses.
# Suites bind to datasets by manifest id (harness/src/runner.rs:294), so the five
# pairs sort themselves out.
#
# Each suite is its dataset's gen1 sweep filtered to op == "contains", the way
# clickbench-url-1m-contains-s42 was made: truth is embedded per query and
# binding is via the dataset checksum, so the reduction preserves validity.
#
#   clickbench-url-1m   142 queries    89 MB
#   tpch-ccomment-sf10  111           109 MB
#   dbpedia-abstract     91           337 MB
#   msmarco-query        84            36 MB
#   tpch-pname-sf10      70            65 MB

strategies = [
  "memmem",
  "prefilter",
  "dict+prefilter",
  "interp",
  "dict+interp",
  "decode",
  "decode+prefilter",
  "dict+decode+prefilter",
  "fsst-prefilter",
  "dict+fsst-prefilter",
  "llm-token-prefilter",
  "dict+llm-token-prefilter",
  "compressed",
  "dict+compressed",
  "comet",
  "pf_kmp",
  "pf_walk",
  "pf_memmem",
  "dict+pf_walk",
]

[[datasets]]
path = "../datasets/clickbench-url-1m"

[[datasets]]
path = "../datasets/dbpedia-abstract"

[[datasets]]
path = "../datasets/msmarco-query"

[[datasets]]
path = "../datasets/tpch-ccomment-sf10"

[[datasets]]
path = "../datasets/tpch-pname-sf10"

[[suites]]
path = "../suites/clickbench-url-1m-contains-s42"

[[suites]]
path = "../suites/dbpedia-abstract-contains-s42"

[[suites]]
path = "../suites/msmarco-query-contains-s42"

[[suites]]
path = "../suites/tpch-ccomment-sf10-contains-s42"

[[suites]]
path = "../suites/tpch-pname-sf10-contains-s42"

# Self-contained Matcher-based pipelines (candidates/common/matcher): each owns
# its scanner, so the [[scanners]] list below applies only to the decode/direct
# candidates further down. The dict_* pair evaluates the predicate once per
# UNIQUE value (the encoded domain) instead of once per row.
[[candidates]]
name = "uncompressed_memmem"

[[candidates]]
name = "uncompressed_prefilter"

[[candidates]]
name = "dict_uncompressed_prefilter"

[[candidates]]
name = "dict_fsst_like_tum"

[[candidates]]
name = "fsst_decode_prefilter"

[[candidates]]
name = "dict_fsst_decode_prefilter"

[[candidates]]
name = "fsst_prefilter"

[[candidates]]
name = "dict_fsst_prefilter"

# SGTT LLM-token-table pipelines: static-dictionary tokenizer codec
# (llm_token_tum, decode-then-eval) and its compressed-domain mandatory-chain
# prefilter (llm_token_prefilter, plus the encoded-domain dict_ peer).
[[candidates]]
name = "llm_token_tum"

[[candidates]]
name = "llm_token_prefilter"

[[candidates]]
name = "dict_llm_token_prefilter"

[[candidates]]
name = "onpair"

[[candidates]]
name = "fsst"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst_like_utn"

[[candidates]]
name = "lz4"

[[candidates]]
name = "zstd"

[[candidates]]
name = "onpair_spiral"
# MaxDictBits 12 vs 16 (4096 vs 65536 max dictionary tokens). No pruned
# configs: `PruneFactor` is gone from the local onpair checkout.
configs = [
  '{"bits":12}',
  '{"bits":16}',
]

[[candidates]]
name = "onpair_spiral_pinned"
# Upstream rev 5927cce, the revision the local checkout started from, so the run
# measures the working tree against its own baseline on every column. No `prune`
# key: `PruneFactor` did not exist yet.
configs = ['{"bits":12}', '{"bits":16}']

[[candidates]]
name = "dict_onpair"

[[candidates]]
name = "dict_onpair_spiral"
# The dict wrapper passes config through to the inner onpair_spiral build, so
# the same two.
configs = [
  '{"bits":12}',
  '{"bits":16}',
]

# memmem only. These scanners feed the harness-composed `decode` strategy of the
# pure codecs (fsst, lz4, zstd, llm_token_tum, onpair), and adding `prefilter`
# there only appends a filtering pass over already-decoded plaintext: it was
# 6-10% slower than memmem for all five, with identical match counts. The one
# thing those cells cross-checked — harness composition vs a self-contained
# implementation — is covered by fsst_decode_prefilter, which computes the same
# answer as fsst/decode+prefilter did (prune 0.75398, FPR 0.390383, both).
[[scanners]]
name = "memmem"

[measure]
chunk_rows = [0, 122880]  # 0 = whole column; 122880 = 60*2048 rows/chunk
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
