# Same three datasets as optimize_prefilter, using the shared preparation recipes.
# Paths are relative to this file. Prepare missing inputs with prepare.py.
# All IDs refer to recipes in datasets/sources.yaml.
# Datasets are indexed one at a time; the budget excludes the loaded column.
output_root = "generated"
cache_root = "cache"
per_cell = 20
index_memory_mib = 16384
negative_attempts = 4000

[[datasets]]
id = "clickbench-url-1m"
path = "../../datasets/clickbench-url-1m"

[[datasets]]
id = "amazon-title"
path = "../../datasets/amazon-title"

[[datasets]]
id = "dbpedia-abstract"
path = "../../datasets/dbpedia-abstract"
