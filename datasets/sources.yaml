# Pinned dataset manifest — the single source of truth for every column the
# benchmark (and the paper) reports on. `datasets/prepare.py` materialises
# entries: download → sha256 verify → extract column → parquet → `bench
# ingest` → verify the canonical checksum below.
#
# Reproducibility contract:
#   - `source.sha256` pins the raw download where upstream is immutable;
#     "recorded-at-prepare" means prepare.py records it on first fetch
#     (write back with --update-checksums) so later runs verify against it.
#   - `expected_checksum` is the canonical dataset identity (`bench ingest`'s
#     logical xxh3 over rows). Two machines that end with the same value have
#     bit-identical benchmark inputs, whatever the raw transport did.
#   - Extraction rules mirror the OnPair compression paper's benchmark
#     (github.com/gargiulofrancesco/compression_benchmark,
#     tools/datasets/*.py), so the row streams match it:
#     original file order, no shuffling, same field/strip/skip rules.
#
# The paper's 2^20-row roster: one row count for every column, so a needle
# grid means the same thing across them.

version: 1
datasets:
  - id: clickbench-url-1mi
    default: true
    source:
      url: https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_0.parquet
      sha256: fa134fe101e68324e0de851146fda69624f5cbb707d387141d1c2a88a219a16d
      license: ClickBench (Yandex Metrica sample, published for benchmarking)
      download_bytes: 122446530
      # datasets/raw/clickbench/ holds every ClickBench file: paper/gen-kernel.sh
      # and e2e/data.sh read hits_0 and hits_1 from here and add theirs here.
      download_dir: clickbench
      extra:
        # hits_0 holds exactly 1,000,000 rows, so 2^20 needs the next partition.
        - url: https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_1.parquet
          sha256: 04f5af123af25d9a6e65584b8fd166fb9b651da11c777ed51379a79bcd52bee3
    kind: parquet
    params: { column: URL, limit: 1048576 }
    expected_checksum: "xxh3:faf3c2a733082cea"
    approx: { rows: 1048576, payload_bytes: 93000000 }
    notes: hits_0 followed by the first 48,576 rows of hits_1.

  - id: amazon-title-1mi
    default: true
    source:
      url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Books.jsonl.gz
      sha256: d41f2348d3e0f3099d2a7ee45b304970282199f92a7ccdfe8ba4b1f753009a10
      license: Amazon Reviews 2023 (McAuley lab, research use)
      download_bytes: 4942125770
    kind: jsonl-field
    params: { field: title, limit: 1048576 }
    expected_checksum: "xxh3:3fc94f5ae9752e41"
    approx: { rows: 1048576, payload_bytes: 55000000 }
    notes: The first 2^20 book titles of the full 4.45M-row column.

  - id: dbpedia-abstract-1mi
    default: true
    source:
      url: https://databus.dbpedia.org/dbpedia/text/short-abstracts/2022.12.01/short-abstracts_lang=en.ttl.bz2
      sha256: e4793027fabd922948763794c4643b07729d207bb537fc766a15961aa711efdd
      license: CC-BY-SA-4.0
      download_bytes: 500000000
    kind: ttl-en-literal
    params: { limit: 1048576 }
    expected_checksum: "xxh3:4b92a22bd44315ca"
    approx: { rows: 1048576, payload_bytes: 354000000 }
    notes: The first 2^20 English short abstracts in file order.

  - id: imdb-charname-1mi
    default: true
    source:
      url: https://event.cwi.nl/da/job/imdb.tgz
      sha256: 25f9d893c54f903366e0c263f88db0d429dbc2b159d4987ebc1e203242a7e988
      license: IMDb data, distributed for the JOB benchmark (research use)
      download_bytes: 1263193115
    kind: tgz-csv-column
    params: { member: char_name.csv, column_index: 1, limit: 1048576 }
    expected_checksum: "xxh3:dbb30c37f9e29394"
    approx: { rows: 1048576, payload_bytes: 15817550 }
    notes: >
      char_name.name, the first 2^20 of 3.14M character names in CSV order
      ("U.S.S. Soldier", "Chris Teigler"), each name stored once: 0.02%
      duplicates, 15.0 B per row, no NULLs. The CSV is in neither id nor
      name order, so the prefix is the window.
