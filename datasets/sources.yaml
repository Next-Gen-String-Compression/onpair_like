  # ---------------------------------------------------------------------
  # The 2^20-row roster for the SA/LCP needle suites. One row count for
  # every column, so a needle grid means the same thing across them.
  # The originals above keep their row counts and checksums; nothing that
  # already ran against them is invalidated.

  - id: clickbench-url-1mi
    default: false
    source:
      url: https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_0.parquet
      sha256: fa134fe101e68324e0de851146fda69624f5cbb707d387141d1c2a88a219a16d
      license: ClickBench (Yandex Metrica sample, published for benchmarking)
      download_bytes: 122446530
      extra:
        # hits_0 holds exactly 1,000,000 rows, so 2^20 needs the next partition.
        - url: https://datasets.clickhouse.com/hits_compatible/athena_partitioned/hits_1.parquet
          sha256: 04f5af123af25d9a6e65584b8fd166fb9b651da11c777ed51379a79bcd52bee3
    kind: parquet
    params: { column: URL, limit: 1048576 }
    expected_checksum: "xxh3:faf3c2a733082cea"
    approx: { rows: 1048576, payload_bytes: 93000000 }
    notes: hits_0 followed by the first 48,576 rows of hits_1.

  - id: amazon-title-1mi
    default: false
    source:
      url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Books.jsonl.gz
      sha256: d41f2348d3e0f3099d2a7ee45b304970282199f92a7ccdfe8ba4b1f753009a10
      license: Amazon Reviews 2023 (McAuley lab, research use)
      download_bytes: 4942125770
    kind: jsonl-field
    params: { field: title, limit: 1048576 }
    expected_checksum: "xxh3:3fc94f5ae9752e41"
    approx: { rows: 1048576, payload_bytes: 55000000 }
    notes: The first 2^20 book titles of the full 4.45M-row column.

  - id: dbpedia-abstract-1mi
