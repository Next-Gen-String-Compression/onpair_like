    params: { sf: 10, table: customer, column: c_comment }
    expected_checksum: "xxh3:af8cd73ba0811038"
    approx: { rows: 1500000, payload_bytes: 108724798 }
    notes: Grammar-generated comment text, U/N=0.94.

  # ---- ClickBench extras: the same pinned hits_0.parquet, other columns ----
  # No extra download — prepare.py reads the file already fetched for
  # clickbench-url-1m. Column choices are justified from measured
