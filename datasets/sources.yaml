  - id: imdb-mcnote-1mi
    default: false
    source:
      url: https://event.cwi.nl/da/job/imdb.tgz
      sha256: 25f9d893c54f903366e0c263f88db0d429dbc2b159d4987ebc1e203242a7e988
      license: IMDb data, distributed for the JOB benchmark (research use)
      download_bytes: 1263193115
    kind: tgz-csv-column
    params: { member: movie_companies.csv, column_index: 4, keep_empty: true,
              offset: 750000, limit: 1048576 }
    expected_checksum: "xxh3:c3379090f966eef0"
    approx: { rows: 1048576, payload_bytes: 12500000 }
    notes: >
      movie_companies.note, the only sparse column in the roster: 48.8% of the
      2.61M rows are NULL and keep_empty preserves them as empty rows, which
      stay in the selectivity denominator and match nothing. The column is
      ordered with the notes first (2-8% NULL over the first 1.2M rows, ~89%
      after), so the window starts at row 750,000, where it is 49.3% empty and
      so matches the whole column's own 48.75%. A prefix would have been 5.7%.
