    expected_checksum: recorded-at-prepare
    approx: { rows: 69000, payload_bytes: 3500000 }
    notes: >
      Short search phrases, but only 6.9% of the partition's rows are
      non-empty — 69k rows, not a million. The row count is in the id
      rather than the notes so no spec can accidentally treat it as a
      million-row column.

