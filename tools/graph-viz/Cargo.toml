[package]
name = "onpair-graph-viz"
version = "0.1.0"
edition = "2024"
publish = false
description = "Render OnPair's substring-prefilter alignment DAG and its minimum vertex cut"

# Own workspace: this crate has its own lockfile so it can pin the same OnPair
# revision as the benchmark without colliding with the repository lockfile.
[workspace]

[dependencies]
onpair = { package = "onpair-benchmark-artifact", path = "../onpair-artifact" }
arrow-array = "59.0.0"
arrow-ipc = "59.0.0"
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = true
