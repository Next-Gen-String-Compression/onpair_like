# The SIMD-cut ablations: specs/micro/medium.toml's columns and needles over the two
# debug candidates, each with its symbol table sorted (the default) or not, and planned
# with the chunk's frequency counts (the default) or uniform frequencies. One run holds
# every variant. paper/gen-ablation.sh; plot_ablation.py draws the ablation-sort and
# ablation-freq figures.
strategies = ["pf_walk", "fsst-prefilter"]

[[datasets]]
path = "../../../datasets/clickbench-url-1mi"

[[datasets]]
path = "../../../datasets/amazon-title-1mi"

[[datasets]]
path = "../../../datasets/dbpedia-abstract-1mi"

# char_name.name: short, nearly every row distinct.
[[datasets]]
path = "../../../datasets/imdb-charname-1mi"

[[suites]]
path = "../../../experiments/matcher_selection/generated/clickbench-url-1mi/sa-lcp-v1-s42-n10-76a1cfeaf7ff8fbe"

[[suites]]
path = "../../../experiments/matcher_selection/generated/amazon-title-1mi/sa-lcp-v1-s42-n10-9355081547f10caf"

[[suites]]
path = "../../../experiments/matcher_selection/generated/dbpedia-abstract-1mi/sa-lcp-v1-s42-n10-2862fe216f2b674b"

[[suites]]
path = "../../../experiments/matcher_selection/generated/imdb-charname-1mi/sa-lcp-v1-s42-n10-9adc88e9eb33e0eb"

[[candidates]]
name = "onpair_spiral_debug"
configs = [
    '{"bits":12,"prune":1.0}',
    '{"bits":12,"prune":1.0,"sorted":false}',
    '{"bits":12,"prune":1.0,"uniform":true}',
    '{"bits":16,"prune":1.0}',
    '{"bits":16,"prune":1.0,"sorted":false}',
    '{"bits":16,"prune":1.0,"uniform":true}',
]

[[candidates]]
name = "fsst_prefilter_debug"
configs = ['{}', '{"sorted":false}', '{"uniform":true}']

[measure]
chunk_rows = [524288]
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
