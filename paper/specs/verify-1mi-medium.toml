# The three verifiers on the 2^20-row roster, ten needles per grid cell: the datasets and
# generated suites of micro-1mi-medium.toml, run through onpair_spiral alone so
# the verify figure stands on the same columns and needles as the rest of the
# micro-benchmark.
#
#   paper/gen-micro-data.sh --medium     runs this beside micro-1mi-medium.toml
#
# micro-1mi-medium.toml cannot carry these strategies: its `strategies` list is
# the one every candidate is filtered by, and pf_memmem_superset and
# pf_kmp_superset exist only on onpair_spiral. Splitting them out also keeps
# the row-group sweep off this spec, which needs one size and not five.
#
# That size is 524288, the row group every micro figure but the sweep is
# measured at: this figure reads per row of the column, where the row group is
# part of the answer, not per candidate row, where it is not.

strategies = ["pf_walk", "pf_memmem_superset", "pf_kmp_superset"]

[[datasets]]
path = "../../datasets/clickbench-url-1mi"
[[datasets]]
path = "../../datasets/amazon-title-1mi"
[[datasets]]
path = "../../datasets/dbpedia-abstract-1mi"
[[datasets]]
path = "../../datasets/imdb-mcnote-1mi"
[[suites]]
path = "../../experiments/matcher_selection/generated/clickbench-url-1mi/sa-lcp-v1-s42-n10-76a1cfeaf7ff8fbe"
[[suites]]
path = "../../experiments/matcher_selection/generated/amazon-title-1mi/sa-lcp-v1-s42-n10-9355081547f10caf"
[[suites]]
path = "../../experiments/matcher_selection/generated/dbpedia-abstract-1mi/sa-lcp-v1-s42-n10-2862fe216f2b674b"
[[suites]]
path = "../../experiments/matcher_selection/generated/imdb-mcnote-1mi/sa-lcp-v1-s42-n10-12bb2d5e74a4ca68"

[[candidates]]
name = "onpair_spiral"
configs = ['{"bits":12,"prune":1.0}', '{"bits":16,"prune":1.0}']

[measure]
chunk_rows = [524288]
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
