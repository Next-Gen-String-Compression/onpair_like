# pf_walk, and `decode`: OnPair as a codec, the chunk decoded and then searched.
[[candidates]]
name = "onpair_spiral"
configs = ['{"bits":12,"prune":1.0}', '{"bits":16,"prune":1.0}']

[[candidates]]
name = "fsst_prefilter"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst"

# memmem over the uncompressed column: one pass under `all`, spans of
# selected rows otherwise.
[[candidates]]
name = "uncompressed_memmem"

[[scanners]]
name = "memmem-hay"

[measure]
chunk_rows = [0]
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
