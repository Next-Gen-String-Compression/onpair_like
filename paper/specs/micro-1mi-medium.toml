# The micro-benchmark on the 2^20-row roster, over four columns of 1,048,576
# rows each, with the SA + LCP needles of experiments/matcher_selection
# (10 per grid cell, 2,155 needles).
#
#   paper/gen-micro-data.sh --medium # runs this spec and redraws the figures
#
# The suites are generated, not committed. Rebuild them with
#   ./target/release/matcher-selection --config experiments/matcher_selection/config-1mi.toml --per-cell 10 --bless
# The directory names carry the request fingerprint, so they change if the
# quota, seed or a dataset does.

strategies = ["pf_walk", "decode", "interp", "fsst-prefilter", "direct"]

[[datasets]]
path = "../../datasets/clickbench-url-1mi"

[[datasets]]
path = "../../datasets/amazon-title-1mi"

[[datasets]]
path = "../../datasets/dbpedia-abstract-1mi"

# movie_companies.note: 49.3% of its rows are empty, the only sparse column here.
[[datasets]]
path = "../../datasets/imdb-mcnote-1mi"

[[suites]]
path = "../../experiments/matcher_selection/generated/clickbench-url-1mi/sa-lcp-v1-s42-n10-76a1cfeaf7ff8fbe"

[[suites]]
path = "../../experiments/matcher_selection/generated/amazon-title-1mi/sa-lcp-v1-s42-n10-9355081547f10caf"

[[suites]]
path = "../../experiments/matcher_selection/generated/dbpedia-abstract-1mi/sa-lcp-v1-s42-n10-2862fe216f2b674b"

[[suites]]
path = "../../experiments/matcher_selection/generated/imdb-mcnote-1mi/sa-lcp-v1-s42-n10-12bb2d5e74a4ca68"

[[candidates]]
name = "onpair_spiral"
configs = ['{"bits":12,"prune":1.0}', '{"bits":16,"prune":1.0}']

# OnPair as a codec: decode the chunk, then one memmem-hay pass over it.
[[candidates]]
name = "onpair"

[[candidates]]
name = "fsst_like_tum"

[[candidates]]
name = "fsst"

[[candidates]]
name = "fsst_prefilter"

# memmem-hay over the raw view (`direct`), no codec at all.
[[candidates]]
name = "uncompressed"

# Bulk scan: one pass over the chunk's payload, hits mapped back to rows.
[[scanners]]
name = "memmem-hay"

[measure]
chunk_rows = [0, 524288, 131072, 32768, 2048]
warmup = 2
min_iters = 3
min_millis = 0
skip_checksum_verify = true
