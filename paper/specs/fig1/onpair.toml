# Figure 1's OnPair16 bars: simd_cut_onpair simd-cut at 16 bits, the per-row scan
# below one selected row per 57 codes and the full scan above, under the
# pre-selections the figure draws (2^-7, 2^-3, all), on the same needles and
# columns, NEON.
#
#   paper/gen-fig1.sh

strategies = ["simd-cut"]

[[selections]]
kind = "all"

[[selections]]
kind = "uniform"
fraction = 0.0078125
seed = 7

[[selections]]
