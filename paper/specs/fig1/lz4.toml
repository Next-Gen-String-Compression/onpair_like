# Figure 1's LZ4 bars: decompress + memmem under the pre-selections the figure
# draws from rows/selection.toml (2^-7, 2^-3, all), on the same needles and
# columns, NEON. LZ4 has no decode_selected, so the harness decodes every
# row and intersects with the selection inside the timed region.
#
#   paper/gen-fig1.sh

