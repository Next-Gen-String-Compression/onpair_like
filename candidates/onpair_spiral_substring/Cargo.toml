# SpiralDB's OnPair on the `refactor/substring-search` branch, beside the local
# checkout (`onpair_spiral`), the pinned rev and the scan-refactor branch.
# Nothing crosses between them.
[package]
name = "lb-cand-onpair-spiral-substring"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lb-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# branch = "refactor/substring-search", head 940f77c at time of integration.
# Pinned by rev: a measurement has to name the code it measured.
onpair = { git = "https://github.com/spiraldb/onpair.git", rev = "940f77cdd8b140a2e004a1fddb347aa926e02dac" }
