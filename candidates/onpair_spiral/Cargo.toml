# SpiralDB's OnPair (github.com/spiraldb/onpair) as a query-axis candidate,
# exercising its `feat/search-prefilter` branch: a SIMD substring prefilter
# with two pluggable verify paths. Pinned to a rev (the branch is pre-release
# and moves); bump the rev to track it. Distinct from the `onpair` candidate,
# which links the C++ onpair_cpp compressed-domain automata.
[package]
name = "lb-cand-onpair-spiral"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lb-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# branch = "feat/search-prefilter", head 75e80c4. That branch moved the token
# frequency index under `search::index`, and priced profitability per row --
# `PrefilterAnalysis::comparison_cost`, `::expected_candidate_row_fraction` and
# `::total_frequency` are the cover facts this wrapper declares to the harness.
# 75e80c4 dropped the scalar membership-table kernels, so every target now runs
# SIMD probes for any cover: a wide cover is slow everywhere rather than slow on
# AArch64 and fast on pre-AVX-512 x86, and the one calibrated profitability
# guard is correct on every host.
onpair = { package = "onpair-benchmark-artifact", path = "../../tools/onpair-artifact" }
