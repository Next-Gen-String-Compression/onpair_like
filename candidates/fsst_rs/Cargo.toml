# FSST (the Rust `fsst-rs` port) as a compressed-domain query-axis candidate:
# OnPair's substring prefilter planned over an FSST symbol table, verified by
# decompressing the survivors. Distinct from the `fsst` candidate, which links
# the C++ cwida/fsst and only decodes, and from `fsst_prefilter`, whose
# prefilter is the C++ mandatory-chain matcher rather than a min-cut cover.
[package]
name = "lb-cand-fsst-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

# The candidate's source needs `onpair::fsst`, `prefilter_candidates_sequences`
# and `PrefilterAnalysis::sequence_*`, none of which the local onpair still has.
# Until it is ported the crate compiles to an empty lib: it stays a workspace
# member so its manifest resolves, and nothing links it.
[features]
default = []
enabled = []

[dependencies]
lb-abi = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Same version OnPair depends on, so one copy of the crate and one `Compressor`
# type across the transcode boundary.
fsst-rs = "0.6"
# Local checkout: the escape-token prefilter and `transcode_fsst_to_onpair` this
# candidate is built on are unreleased. Pin a rev once they land, as
# `onpair_spiral` does.
onpair = { path = "../../../onpair" }
